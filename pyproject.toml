[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trustgraph-v2x"
version = "0.1.0"
description = "Trust-aware temporal graph learning and vehicular handover research prototype"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "torch>=2.2,<3"]

[project.optional-dependencies]
sumo = ["eclipse-sumo>=1.22,<2", "traci>=1.22,<2"]
dev = ["pytest>=8,<10"]

[project.scripts]
trustgraph = "trustgraph.cli:main"

[tool.setuptools.packages.find]
include = ["trustgraph*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
