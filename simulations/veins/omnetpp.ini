include upstream.ini

[Config TrustGraphVeins]
extends = CBR-DL
network = TrustGraphRoad
sim-time-limit = 35s
seed-set = 1001
*.veinsManager.moduleType = "TrustGraphCar"
*.veinsManager.moduleName = "car"
*.veinsManager.configFile = "road.sumocfg"
*.veinsManager.updateInterval = 0.1s
*.veinsManager.autoShutdown = false
*.veinsManager.margin = 25

*.car[0].servingNodeId = 0
*.car[0].nrServingNodeId = 1
*.car[0].cellularNic.nrChannelModel[0].componentCarrierModule = "carrierAggregation.componentCarrier[0]"
*.gnb1.mobility.initialY = 25m
*.gnb2.mobility.initialY = 25m
**.mobility.constraintAreaMinY = 0m

*.car[0].numApps = 1
*.car[0].app[0].typename = "CbrReceiver"
*.car[0].app[0].localPort = 3000
*.server.numApps = 1
*.server.app[0].destAddress = "car[0]"
*.server.app[0].startTime = 1s
*.server.app[0].finishTime = 34.9s
# The car is created after initialization. Create its downlink data bearer
# when the first packet of the default QoS flow arrives.
*.bearerConfigurator.onDemandDrbs = [{coreNetwork: "5gc", mappedQfis: [0], lcg: 3, rlcMode: "UM"}]

cmdenv-express-mode = false
cmdenv-event-banners = false
*.car[0].cellularNic.rrc.nrConnectionControl.cmdenv-log-level = info
**.cmdenv-log-level = warn
output-scalar-file = handover.sca
output-vector-file = handover.vec
