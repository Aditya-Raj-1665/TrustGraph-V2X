# Run from Simu5G 1.8.1 simulations/nr/standalone_multicell.
include omnetpp.ini

[Config TrustGraphHandover]
extends = CBR-DL
description = "One moving NR UE crossing between two gNBs; conventional handover"
sim-time-limit = 35s
seed-set = 1001
*.numUe = 1
*.server.numApps = 1
*.ue[0].mobility.initialX = 250m
*.ue[0].mobility.initialY = 500m
*.ue[0].mobility.initialMovementHeading = 0deg
*.ue[0].mobility.speed = 15mps
*.server.app[*].startTime = 0.1s
*.server.app[*].finishTime = 34.9s
cmdenv-express-mode = false
*.ue[0].cellularNic.rrc.nrConnectionControl.cmdenv-log-level = info
**.cmdenv-log-level = warn
**.vector-recording = true
output-scalar-file = ${resultdir}/handover.sca
output-vector-file = ${resultdir}/handover.vec

[Config TrustGraphStationary]
extends = TrustGraphHandover
description = "Stationary negative control with identical radio settings"
*.ue[0].mobility.speed = 0mps
